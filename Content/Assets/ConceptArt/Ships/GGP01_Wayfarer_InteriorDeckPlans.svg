<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <style>
      .bg{fill:#0a0f14}.panel{fill:#111a22;stroke:#31424d;stroke-width:2}.room{stroke:#637782;stroke-width:1.5}.corridor{fill:#172a31;stroke:#5aa8a5;stroke-width:2}.title{fill:#dce9eb;font:700 26px sans-serif;letter-spacing:2px}.sub{fill:#8da2aa;font:14px sans-serif}.label{fill:#e7f1f0;font:600 15px sans-serif}.small{fill:#b8c7c9;font:12px sans-serif}.axis{fill:#78cbc2;font:700 13px sans-serif}.grid{stroke:#364851;stroke-width:1}.link{fill:#efb454;stroke:#ffe0a3;stroke-width:2}.air{fill:#62b9cc}.pod{fill:#d87843}.critical{fill:none;stroke:#f2cc58;stroke-width:5;stroke-dasharray:10 7}.command{fill:#263b55}.hab{fill:#234b49}.engine{fill:#5a3925}.service{fill:#343b42}.special{fill:#7d3940}.work{fill:#5b5630}.power{fill:#774d25}.legend{fill:#111a22;stroke:#31424d;stroke-width:2}
    </style>
    <pattern id="cells" width="100" height="82" patternUnits="userSpaceOnUse"><path d="M100 0H0V82" fill="none" class="grid"/></pattern>
  </defs>
  <rect width="1600" height="1200" class="bg"/>
  <text x="70" y="55" class="title">GGP-01 WAYFARER // PLAYABLE SECTOR DECK PLAN</text>
  <text x="70" y="82" class="sub">Decks 09–12 of a 24-deck capital ship · one 72 m damage-control sector · AFT at left · FORE at right</text>

  <!-- Deck 04 -->
  <g transform="translate(70 120)">
    <rect width="1460" height="215" rx="12" class="panel"/>
    <text x="20" y="32" class="title">D12 EMERGENCY COMMAND + MISSION</text>
    <text x="1298" y="31" class="axis">AFT  ←  →  FORE</text>
    <rect x="180" y="48" width="300" height="62" class="room command"/><rect x="480" y="48" width="500" height="62" class="room command"/><rect x="980" y="48" width="400" height="62" class="room command"/>
    <rect x="180" y="138" width="300" height="62" class="room command"/><rect x="480" y="138" width="500" height="62" class="room command"/><rect x="980" y="138" width="400" height="62" class="room command"/>
    <rect x="180" y="110" width="1200" height="28" class="corridor"/><rect x="180" y="48" width="1200" height="152" fill="url(#cells)"/>
    <text x="205" y="82" class="label">AVIONICS / COMMS</text><text x="538" y="82" class="label">OFFICER BERTHING + MISSION PLANNING</text><text x="1030" y="82" class="label">SENSORS / SECURE ARCHIVE / OBSERVATION</text>
    <text x="205" y="175" class="small">redundant control trunks</text><text x="540" y="175" class="small">briefing · drone control · chart rooms</text><text x="1040" y="175" class="small">forward command support</text>
    <rect x="580" y="103" width="20" height="42" class="link"/><rect x="1180" y="103" width="20" height="42" class="link"/>
    <rect x="480" y="48" width="12" height="62" class="air"/><rect x="1180" y="138" width="12" height="62" class="air"/>
  </g>

  <!-- Deck 03 -->
  <g transform="translate(70 355)">
    <rect width="1460" height="215" rx="12" class="panel"/>
    <text x="20" y="32" class="title">D11 HABITATION + MEDICAL + EMERGENCY CIC</text>
    <rect x="180" y="48" width="100" height="62" class="room special"/><rect x="280" y="48" width="200" height="62" class="room work"/><rect x="480" y="48" width="500" height="62" class="room hab"/><rect x="980" y="48" width="300" height="62" class="room hab"/><rect x="1280" y="48" width="100" height="62" class="room special"/>
    <rect x="180" y="138" width="300" height="62" class="room hab"/><rect x="480" y="138" width="500" height="62" class="room hab"/><rect x="980" y="138" width="300" height="62" class="room hab"/><rect x="1280" y="138" width="100" height="62" class="room special"/>
    <rect x="180" y="110" width="1200" height="28" class="corridor"/><rect x="180" y="48" width="1200" height="152" fill="url(#cells)"/>
    <text x="190" y="83" class="label">CRYO</text><text x="296" y="83" class="label">WORKSHOP</text><text x="535" y="83" class="label">MEDICAL / GALLEY / BUNKS / COMMONS</text><text x="1015" y="83" class="label">LIFE SUPPORT + ESCAPE</text><text x="1302" y="83" class="label">CIC*</text>
    <text x="205" y="175" class="small">aft support</text><text x="535" y="175" class="small">parallel port/starboard traversal loop</text><text x="1018" y="175" class="small">breach opposite CIC*</text>
    <path d="M225 125H370H700V240" class="critical"/><text x="690" y="203" class="axis">TO POWER ↓</text>
    <rect x="680" y="103" width="20" height="42" class="link"/><rect x="1080" y="103" width="20" height="42" class="link"/>
    <rect x="480" y="48" width="12" height="62" class="air"/><rect x="1180" y="138" width="12" height="62" class="air"/>
    <circle cx="1085" cy="78" r="8" class="pod"/><circle cx="1185" cy="170" r="8" class="pod"/><circle cx="1285" cy="170" r="8" class="pod"/>
  </g>

  <!-- Deck 02 -->
  <g transform="translate(70 590)">
    <rect width="1460" height="215" rx="12" class="panel"/>
    <text x="20" y="32" class="title">D10 DISTRIBUTION ENGINEERING + POWER</text>
    <rect x="180" y="48" width="200" height="62" class="room engine"/><rect x="380" y="48" width="600" height="62" class="room engine"/><rect x="980" y="48" width="400" height="62" class="room engine"/>
    <rect x="180" y="138" width="200" height="62" class="room power"/><rect x="380" y="138" width="600" height="62" class="room engine"/><rect x="980" y="138" width="400" height="62" class="room engine"/>
    <rect x="180" y="110" width="1200" height="28" class="corridor"/><rect x="180" y="48" width="1200" height="152" fill="url(#cells)"/>
    <text x="194" y="82" class="label">MAIN ENGINE</text><text x="430" y="82" class="label">COOLANT / CONVERTERS / MACHINE SHOP</text><text x="1030" y="82" class="label">DAMAGE CONTROL + DISTRIBUTION</text>
    <text x="195" y="175" class="label">POWER CONTROL</text><text x="430" y="175" class="small">reactor-transfer trunk runs through midship</text>
    <path d="M690 30V125H250" class="critical"/><text x="255" y="128" class="axis">RESTORE BUS</text>
    <rect x="680" y="103" width="20" height="42" class="link"/><rect x="1080" y="103" width="20" height="42" class="link"/><rect x="580" y="103" width="20" height="42" class="link"/><rect x="1180" y="103" width="20" height="42" class="link"/>
    <rect x="480" y="48" width="12" height="62" class="air"/><rect x="1180" y="138" width="12" height="62" class="air"/>
  </g>

  <!-- Deck 01 -->
  <g transform="translate(70 825)">
    <rect width="1460" height="215" rx="12" class="panel"/>
    <text x="20" y="32" class="title">D09 SERVICE + CARGO + UTILITIES</text>
    <rect x="180" y="48" width="300" height="62" class="room service"/><rect x="480" y="48" width="500" height="62" class="room service"/><rect x="980" y="48" width="400" height="62" class="room service"/>
    <rect x="180" y="138" width="300" height="62" class="room service"/><rect x="480" y="138" width="500" height="62" class="room service"/><rect x="980" y="138" width="400" height="62" class="room service"/>
    <rect x="180" y="110" width="1200" height="28" class="corridor"/><rect x="180" y="48" width="1200" height="152" fill="url(#cells)"/>
    <text x="205" y="82" class="label">TANKAGE + WATER RECOVERY</text><text x="540" y="82" class="label">CARGO / STORES / FEEDSTOCK</text><text x="1035" y="82" class="label">UTILITY JUNCTIONS + HANDLING</text>
    <text x="205" y="175" class="small">waste processing</text><text x="540" y="175" class="small">central cargo rail · movable obstacles</text><text x="1035" y="175" class="small">dangerous bypass route</text>
    <rect x="580" y="103" width="20" height="42" class="link"/><rect x="1180" y="103" width="20" height="42" class="link"/>
    <rect x="480" y="48" width="12" height="62" class="air"/><rect x="1180" y="138" width="12" height="62" class="air"/>
  </g>

  <g transform="translate(70 1065)">
    <rect width="1460" height="92" rx="10" class="legend"/>
    <text x="20" y="30" class="label">LEGEND</text>
    <rect x="110" y="15" width="22" height="22" class="link"/><text x="140" y="31" class="small">vertical route window</text>
    <rect x="300" y="15" width="22" height="22" class="air"/><text x="330" y="31" class="small">airlock band</text>
    <circle cx="470" cy="26" r="10" class="pod"/><text x="490" y="31" class="small">escape-pod candidate</text>
    <line x1="660" y1="26" x2="720" y2="26" class="critical"/><text x="735" y="31" class="small">critical path</text>
    <text x="20" y="65" class="sub">Colored spans are semantic zones, not fixed room assignments. Grid cells remain seedable; specials and traversal constraints remain authoritative.</text>
  </g>
</svg>
