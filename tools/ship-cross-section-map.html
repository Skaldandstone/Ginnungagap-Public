<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GGP-01 Wayfarer Cross-Section Map</title>
<style>
:root{color-scheme:dark;--bg:#080d12;--panel:#101820;--line:#526772;--text:#dce8ea;--muted:#8da2aa;--cyan:#62c7c3;--gold:#efbe58;--command:#294762;--hab:#28514c;--mission:#4d3f60;--play:#725239;--eng:#633b31;--keel:#373f46}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.35 system-ui,sans-serif}header{display:flex;gap:18px;align-items:end;flex-wrap:wrap;padding:18px 22px;border-bottom:1px solid #263640}h1{font-size:20px;margin:0;letter-spacing:.08em}header p{margin:4px 0 0;color:var(--muted)}nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}button{border:1px solid #3a4d57;background:#111b22;color:var(--text);padding:7px 11px;border-radius:4px;cursor:pointer}button[aria-pressed=true]{border-color:var(--cyan);color:#bff9f5;background:#173036}.controls{display:flex;gap:18px;align-items:center;padding:10px 22px;border-bottom:1px solid #263640;color:var(--muted)}input{accent-color:var(--cyan)}#canvas{padding:18px;overflow:auto}svg{display:block;width:100%;min-width:850px;height:auto;background:#0b1218;border:1px solid #263640}.hull{fill:#111a21;stroke:#617782;stroke-width:2}.grid{stroke:#41545e;stroke-width:1}.deckline{stroke:#657a84;stroke-width:.7}.label{fill:var(--text);font:12px system-ui,sans-serif}.small{fill:var(--muted);font:10px system-ui,sans-serif}.id{fill:var(--text);font:9px ui-monospace,monospace}.axis{stroke:var(--cyan);stroke-width:2;marker-end:url(#arrow)}.playbox{fill:none;stroke:var(--gold);stroke-width:4}.zone{stroke:#72858e;stroke-width:1}.command{fill:var(--command)}.hab{fill:var(--hab)}.mission{fill:var(--mission)}.play{fill:var(--play)}.eng{fill:var(--eng)}.keel{fill:var(--keel)}.room{fill:#1b3036;stroke:#66818a;stroke-width:1}.room.special{fill:#684047}.corridor{fill:#18343a;stroke:var(--cyan);stroke-width:1.5}.hangar{fill:#0b1014;stroke:#5fc8d0;stroke-width:2}.shaft{fill:#54aaa5}.measure{stroke:var(--gold);stroke-width:1;stroke-dasharray:5 4}.hidden{display:none}#detail{padding:9px 22px;color:var(--muted);border-top:1px solid #263640;font-family:ui-monospace,monospace}
</style>
</head>
<body>
<header><div><h1>GGP-01 WAYFARER // CROSS-SECTION MAP</h1><p>1,150 m × 260 m × 150 m · 24 primary decks · canonical playable sector at Z4 / D09–D12</p></div><nav aria-label="View"><button data-view="side" aria-pressed="true">Side section</button><button data-view="top" aria-pressed="false">Top section</button><button data-view="front" aria-pressed="false">Bow</button><button data-view="rear" aria-pressed="false">Stern</button><button data-view="sector" aria-pressed="false">Room sector</button></nav></header>
<div class="controls"><label>Drawing scale <input id="scale" type="range" min="70" max="150" value="100"> <span id="scaleValue">100%</span></label><span>Room module: 6 m × 6 m × 3.2 m clear</span></div>
<main id="canvas"><svg id="map" viewBox="0 0 1400 760" role="img" aria-label="Wayfarer ship cross-section map"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5 0 10z" fill="#62c7c3"/></marker></defs><g id="drawing"></g></svg></main>
<div id="detail" aria-live="polite">Side section · click a generated room in the sector view to inspect its transform.</div>
<script>
const spec={length:1150,beam:260,depth:150,decks:24,pitch:4.3,zones:7,sector:{zone:4,aft:466,fore:538,decks:[9,10,11,12],cols:12,col:6,depth:6,corridor:2.6,sides:[['P',-4.3],['S',4.3]]}};
const svg=document.getElementById('map'),g=document.getElementById('drawing'),detail=document.getElementById('detail');
const NS='http://www.w3.org/2000/svg';
function el(tag,a={},text=''){const n=document.createElementNS(NS,tag);Object.entries(a).forEach(([k,v])=>n.setAttribute(k,v));if(text)n.textContent=text;return n}
function clear(){g.replaceChildren()}
function txt(x,y,s,c='label',anchor='start'){g.append(el('text',{x,y,class:c,'text-anchor':anchor},s))}
function side(){clear();const x=90,y=105,w=1220,h=510;g.append(el('path',{d:`M${x} ${y+80} L${x+120} ${y+20} H${x+w-220} L${x+w} ${y+250} L${x+w-210} ${y+h-25} H${x+120} L${x} ${y+h-90}Z`,class:'hull'}));const innerX=x+100,innerW=w-260,top=y+95,dh=16;const bands=[['command',21,24],['hab',17,20],['mission',13,16],['play',9,12],['eng',5,8],['keel',1,4]];bands.forEach(([c,min,max])=>{const yy=top+(24-max)*dh;g.append(el('rect',{x:innerX,y:yy,width:innerW,height:(max-min+1)*dh,class:`zone ${c}`}));txt(innerX+8,yy+15,`D${String(max).padStart(2,'0')}–D${String(min).padStart(2,'0')}`,'small')});for(let d=0;d<=24;d++){const yy=top+d*dh;g.append(el('line',{x1:innerX,y1:yy,x2:innerX+innerW,y2:yy,class:'deckline'}))}for(let z=1;z<7;z++){const xx=innerX+innerW*z/7;g.append(el('line',{x1:xx,y1:top,x2:xx,y2:top+24*dh,class:'grid'}));txt(xx,top-10,`Z${z+1}`,'small','middle')}const sx=innerX+innerW*3/7,sw=innerW/7,sy=top+12*dh,sh=4*dh;g.append(el('rect',{x:sx,y:sy,width:sw,height:sh,class:'playbox'}));txt(sx+sw/2,sy-9,'PLAYABLE SECTOR · Z4 · D09–D12','label','middle');g.append(el('rect',{x:innerX+innerW*.28,y:top+8*dh,width:innerW*.17,height:4*dh,rx:5,class:'hangar'}));g.append(el('rect',{x:innerX+innerW*.55,y:top+8*dh,width:innerW*.17,height:4*dh,rx:5,class:'hangar'}));txt(x,y+8,'SIDE / LONGITUDINAL SECTION','label');txt(innerX+innerW*.365,top+10*dh+5,'HANGAR','label','middle');txt(innerX+innerW*.635,top+10*dh+5,'HANGAR','label','middle');measure(x+30,y+h+35,x+w-30,y+h+35,'1,150 m');detail.textContent='Side section · pressure zones run aft-to-fore; decks run keel-to-crown.'}
function top(){clear();const x=85,y=100,w=1230,h=520;g.append(el('path',{d:`M${x} ${y+260} L${x+140} ${y+55} H${x+w-260} L${x+w} ${y+260} L${x+w-260} ${y+465} H${x+140}Z`,class:'hull'}));const ix=x+145,iw=w-390;for(let z=0;z<=7;z++){const xx=ix+iw*z/7;g.append(el('line',{x1:xx,y1:y+80,x2:xx,y2:y+440,class:'grid'}));if(z<7)txt(xx+iw/14,y+72,`Z${z+1}`,'small','middle')}g.append(el('rect',{x:ix+iw*2/7,y:y+105,width:iw*1.4/7,height:95,rx:8,class:'hangar'}));g.append(el('rect',{x:ix+iw*2/7,y:y+320,width:iw*1.4/7,height:95,rx:8,class:'hangar'}));g.append(el('rect',{x:ix+iw*3/7,y:y+220,width:iw/7,height:80,class:'playbox'}));txt(x,y+5,'TOP / HORIZONTAL SECTION','label');txt(ix+iw*.3,y+157,'PORT HANGAR','label','middle');txt(ix+iw*.3,y+373,'STARBOARD HANGAR','label','middle');txt(ix+iw*3.5/7,y+266,'Z4 SECTOR','label','middle');measure(x+15,y+505,x+w-15,y+505,'1,150 m');measure(x+w+20,y+55,x+w+20,y+465,'260 m',true);detail.textContent='Top section · paired hangars occupy Mission Operations; the playable module sits deeper in pressure zone 4.'}
function end(rear=false){clear();const cx=700,cy=370,rx=455,ry=270;g.append(el('ellipse',{cx,cy,rx,ry,class:'hull'}));g.append(el('line',{x1:cx-rx,y1:cy,x2:cx+rx,y2:cy,class:'grid'}));for(let d=1;d<=24;d++){const yy=cy+ry-d*(2*ry/25);g.append(el('line',{x1:cx-rx*.78,y1:yy,x2:cx+rx*.78,y2:yy,class:'deckline'}));if(d%4===0)txt(cx-rx*.82,yy+4,`D${String(d).padStart(2,'0')}`,'small','end')}if(rear){[[0,0,72],[-155,-95,48],[0,-135,50],[155,-95,48],[-190,40,42],[-90,105,43],[95,105,43],[190,40,42],[0,140,34]].forEach(([dx,dy,r])=>{g.append(el('circle',{cx:cx+dx,cy:cy+dy,r,fill:'#18343a',stroke:'#62c7c3','stroke-width':3}));g.append(el('circle',{cx:cx+dx,cy:cy+dy,r:r*.45,fill:'#8fe8ed'}))})}else{g.append(el('rect',{x:cx-180,y:cy-ry+38,width:360,height:72,rx:12,fill:'#172931',stroke:'#62c7c3','stroke-width':2}));txt(cx,cy-ry+82,'PANORAMIC BRIDGE / CIC','label','middle')}txt(90,70,rear?'STERN / ENGINE SECTION':'BOW / TRANSVERSE SECTION','label');measure(cx-rx,cy+ry+45,cx+rx,cy+ry+45,'260 m');measure(cx+rx+35,cy-ry,cx+rx+35,cy+ry,'150 m',true);detail.textContent=(rear?'Stern':'Bow')+' section · deck pitch is 4.3 m; large voids may span several primary decks.'}
function sector(){clear();const ox=100,oy=80,cw=92,rh=48,gap=28;txt(ox,45,'EXPLODED PLAYABLE SECTOR · Z4 · SCALE-TRUE ROOM MODULES','label');for(let di=0;di<4;di++){const deck=12-di,base=oy+di*(rh*2+gap+35);txt(ox-20,base+rh+3,`D${deck}`,'label','end');for(let si=0;si<2;si++){const side=si?'S':'P',yy=base+si*(rh+gap);for(let c=1;c<=12;c++){const x=ox+(c-1)*cw,id=`GGP01-D${String(deck).padStart(2,'0')}-Z4-${side}-${String(c).padStart(2,'0')}`,special=(deck===11&&side==='P'&&c===1)||(deck===10&&side==='P'&&c===1);const r=el('rect',{x,y:yy,width:cw-3,height:rh,class:`room${special?' special':''}`,'data-id':id,tabindex:0});r.addEventListener('click',()=>selectRoom(id,deck,side,c));r.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectRoom(id,deck,side,c)}});g.append(r);txt(x+(cw-3)/2,yy+28,`${side}${String(c).padStart(2,'0')}`,'id','middle')}g.append(el('rect',{x:ox,y:yy+rh,width:cw*12-3,height:gap,class:'corridor'}))}txt(ox+cw*12+18,base+22,`D${String(deck).padStart(2,'0')} PORT`,'small');txt(ox+cw*12+18,base+rh+gap+22,`D${String(deck).padStart(2,'0')} STARBOARD`,'small')}measure(ox,700,ox+cw*12-3,700,'72 m · 12 × 6 m bays');txt(ox,735,'IDs expand to GGP01-D##-Z4-{P|S}-## · click a cell for world-space placement','small');detail.textContent='Room sector · 96 stable slots; cell width represents 6 m and deck separation represents the 4.3 m pitch.'}
function selectRoom(id,deck,side,bay){const x=(466+(bay-.5)*6).toFixed(1),y=(side==='P'?-4.3:4.3).toFixed(1),z=((deck-1)*4.3).toFixed(1);detail.textContent=`${id} · center from ship datum: X ${x} m, Y ${y} m, Z ${z} m · bounds 6.0 × 6.0 × 3.2 m`}
function measure(x1,y1,x2,y2,label,vert=false){g.append(el('line',{x1,y1,x2,y2,class:'measure'}));txt((x1+x2)/2,(y1+y2)/2+(vert?0:-7),label,'small','middle')}
const views={side,top,front:()=>end(false),rear:()=>end(true),sector};document.querySelectorAll('button[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('button[data-view]').forEach(x=>x.setAttribute('aria-pressed',x===b));views[b.dataset.view]()});document.getElementById('scale').oninput=e=>{const v=e.target.value;document.getElementById('scaleValue').textContent=v+'%';svg.style.width=v+'%'};side();
</script>
</body>
</html>
